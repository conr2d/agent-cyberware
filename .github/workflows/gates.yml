# The same gates the local hooks run, for commits that arrive without them: a clone with
# core.hooksPath unset, a merge, a rebase, or a commit made with --no-verify.
name: gates

on:
  push:
  pull_request:
    # `edited` so a retitled pull request re-runs the squash-subject check below
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tree checks
        run: |
          if git ls-files | grep -E '(^|/)\.(private|omc|omx)/'; then
            echo "::error::private context or agent-runtime state is tracked"; exit 1
          fi
          ./.githooks/check-citations.py .
          ./.githooks/check-frontmatter.py .
          ./.githooks/check-inventory.py .

      # A branch deletion has no commits of its own, and its run is given the default branch's
      # tip, so `before..after` would select default-branch history the deletion never added.
      - name: Commit messages
        if: github.event_name != 'push' || !github.event.deleted
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            set -- "$BEFORE..$AFTER"
          elif [ "$REF" != "$DEFAULT" ] && git rev-parse -q --verify "origin/$DEFAULT" >/dev/null; then
            # A new branch: only what it adds. Every commit reachable would include the default
            # branch's history, so one bad subject already merged fails every new branch forever.
            set -- "$AFTER" --not "origin/$DEFAULT"
          else
            set -- "$AFTER"           # the default branch's first push: every commit reachable
          fi
          status=0 n=0
          for c in $(git rev-list --no-merges "$@"); do
            n=$((n + 1))
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! ./.githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $c"; status=1
            fi
          done
          # The hook is silent on success, so without this an empty range passes unseen.
          echo "checked $n commit message(s) in $*"
          exit $status

      # The squash commit's subject defaults to the title plus " (#N)", and that subject is what
      # `main` keeps. Checking it here fails the pull request instead of `main` after the merge.
      - name: Squash subject
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" > "$RUNNER_TEMP/squash"
          if ! ./.githooks/commit-msg "$RUNNER_TEMP/squash"; then
            echo "::error::the default squash subject fails; shorten the pull request title"
            exit 1
          fi
