schema_version: "1.1"
name: n-review-fn
tags: ["near-miss"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "Review this Python function for bugs:\n\n```python\ndef mean(xs):\n    return sum(xs) / len(xs)\n```"
graders:
  - name: cross-model-not-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
    min: 0
    max: 0
