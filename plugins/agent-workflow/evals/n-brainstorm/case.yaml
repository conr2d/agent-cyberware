schema_version: "1.1"
name: n-brainstorm
tags: ["near-miss"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "Let's brainstorm how to add offline sync to our notes app before we write any code. Ask me questions first."
graders:
  - name: cross-model-not-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
    min: 0
    max: 0
