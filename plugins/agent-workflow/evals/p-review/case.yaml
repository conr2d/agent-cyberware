schema_version: "1.1"
name: p-review
tags: ["trigger"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "Codex just finished implementing a feature on this branch as the author agent. Before I commit, how should you review and seal its diff? Describe the steps; don't run anything."
graders:
  - name: cross-model-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
