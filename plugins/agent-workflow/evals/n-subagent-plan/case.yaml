schema_version: "1.1"
name: n-subagent-plan
tags: ["near-miss"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "I have a written implementation plan in docs/plan.md. Execute it task by task using subagents."
graders:
  - name: cross-model-not-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
    min: 0
    max: 0
