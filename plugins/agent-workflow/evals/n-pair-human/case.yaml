schema_version: "1.1"
name: n-pair-human
tags: ["near-miss"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "What are good practices for pair programming with a human colleague over video call?"
graders:
  - name: cross-model-not-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
    min: 0
    max: 0
