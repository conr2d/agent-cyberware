schema_version: "1.1"
name: p-spec
tags: ["trigger"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "I want Codex to implement a retry wrapper around our HTTP client while you review its work afterwards. Write the spec I should hand to Codex. Don't run anything."
graders:
  - name: cross-model-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?cross-model\""
