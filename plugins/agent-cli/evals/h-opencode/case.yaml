schema_version: "1.1"
name: h-opencode
tags: ["trigger", "opt-in"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "From a shell script I want to run opencode with a prompt and get JSON output I can parse. What command should I use? Don't run anything."
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?non-interactive\""
  - name: read-opencode.md
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*references/opencode\\.md\""
  - name: devnull
    type: "regex"
    pattern: "</dev/null|< /dev/null"
