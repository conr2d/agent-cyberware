schema_version: "1.1"
name: h-claude-resume
tags: ["trigger"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "I'm writing a Python driver that calls `claude -p` and later continues the same conversation. Show me the exact command lines for the first call and the follow-up. Don't run anything."
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?non-interactive\""
  - name: session-id
    type: "regex"
    pattern: "--session-id"
