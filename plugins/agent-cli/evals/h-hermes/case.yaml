schema_version: "1.1"
name: h-hermes
tags: ["trigger", "opt-in"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "Give me the command to run hermes non-interactively, with the prompt coming from a file, from a cron job. Don't run anything."
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?non-interactive\""
  - name: read-hermes.md
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*references/hermes\\.md\""
  - name: query-file
    type: "regex"
    pattern: "--query-file"
