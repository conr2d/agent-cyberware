schema_version: "1.1"
name: n-theme
tags: ["near-miss"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "How do I change the color theme in Claude Code's interactive UI?"
graders:
  - name: skill-not-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?non-interactive\""
    min: 0
    max: 0
