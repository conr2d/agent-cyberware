schema_version: "1.1"
name: h-grok
tags: ["trigger", "opt-in"]
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  prompt: "How do I call the grok CLI headlessly from a script and get JSON back? Don't run anything."
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?non-interactive\""
  - name: read-grok.md
    type: "tool_used"
    tool: "Read"
    input_match: "\"file_path\"\\s*:\\s*\"[^\"]*references/grok\\.md\""
